<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Área interna · Pinheiro Advogados</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#231F20">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--ink:#231F20;--mut:#555;--line:#c8c8c8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Montserrat","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
header{background:#231F20;color:#fff;margin:-20px -16px 16px;padding:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:flex-end}
h1{font:600 28px/1.1 "Montserrat","Helvetica Neue",Arial,sans-serif;margin:0;letter-spacing:.06em}
.sub{color:var(--mut);font-size:13px}header .sub{color:#d0d0d0}
nav{display:flex;gap:2px;border-bottom:2px solid #231F20;margin-bottom:18px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:10px 13px;font-weight:500;font-size:14px;font-family:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:#231F20;border-color:#231F20;font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #231F20;outline-offset:2px}
h2{font:600 19px "Montserrat","Helvetica Neue",Arial,sans-serif;margin:0 0 10px}
.card{background:var(--card);border:1px solid #231F20;padding:14px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{padding:12px 14px;border:1px solid #231F20;background:#fff}
.stat b{display:block;font:600 24px "Montserrat","Helvetica Neue",Arial,sans-serif}.stat span{color:var(--mut);font-size:12.5px}
.stat.red{border-left:7px solid #231F20;background:#efefef}
.alert{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}
.chip{display:inline-block;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;border:1.5px solid #231F20;border-radius:3px}
.red{background:#231F20;color:#fff}.red::before{content:"! "}
.org{background:#fff;color:#231F20;border-width:2.5px}
.yel{background:#dcdcdc;color:#231F20}
.grn{background:#fff;color:#231F20}.grn::before{content:"✓ "}
.blu{background:#f2f2f2;color:#222;border-color:#888;font-weight:600}
.mut{background:#fff;color:#555;border:1.5px dashed #777;font-weight:600}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:12px;background:#231F20;color:#fff;font-weight:600;padding:8px;letter-spacing:.04em;text-transform:uppercase}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid #231F20;background:#fff;color:#231F20;border-radius:3px;padding:6px 11px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer}
.btn.p{background:#231F20;color:#fff}.btn.d{border-style:dashed}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.ct{border:1px solid #231F20;padding:14px;margin-bottom:14px;background:#fff}
.ct h3{margin:0;font:600 18px "Montserrat","Helvetica Neue",Arial,sans-serif}.ct .meta{color:var(--mut);font-size:13px;margin:2px 0 10px}
.kv{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:10px}.kv small{display:block;color:var(--mut);font-size:12px}.kv b{font-weight:700}
.lst{font-size:13.5px;margin:4px 0}.lst a{color:#231F20;font-weight:700}
table.pt{min-width:560px;border:2px solid #231F20;margin:6px 0 10px}.pt th{font-size:11.5px}.pt td{border:1px solid #231F20;font-size:14px;padding:8px 10px}
dialog{border:2px solid #231F20;border-radius:4px;padding:18px;background:#fff;color:#231F20;width:min(440px,94vw)}dialog::backdrop{background:#000a}
label{display:block;font-size:13px;margin:10px 0 3px;color:#333;font-weight:600}input,select,textarea{width:100%;padding:8px;border:1.5px solid #231F20;border-radius:3px;background:#fff;color:#231F20;font:inherit}
.note{font-size:12.5px;color:var(--mut);margin:8px 0}.empty{color:var(--mut);padding:16px 0}

/* Identidade visual do site Pinheiro Advogados */
h1,h2,.ct h3,.stat b{font-weight:700;letter-spacing:0}
header{align-items:center}
.hd-marca{display:flex;align-items:center;gap:16px}
.hd-txt{display:flex;flex-direction:column;gap:2px;border-left:1px solid #3A3536;padding-left:16px}
.hd-txt b{font-weight:300;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#F8F8F8}
.hd-txt span{font-size:12px;color:#999}
header .btn{background:transparent;color:#F8F8F8;border-color:#999}
header .btn:hover{border-color:#F8F8F8}
header a.voltar{color:#D0D0D0;font-size:12px;text-decoration:none;letter-spacing:.08em}
header a.voltar:hover{color:#fff}
nav button{text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.btn{border-radius:0}
.chip{border-radius:0}
#login{background:#231F20 !important}
#lf{background:#F8F8F8;border:0 !important;padding:32px !important;display:flex;flex-direction:column}
#lf .logo-login{display:flex;justify-content:center;margin-bottom:6px}
#lf .titulo-login{font-weight:300;font-size:12px;letter-spacing:.32em;text-transform:uppercase;text-align:center;color:#231F20}
#lf .sub{text-align:center}
#lf a.voltar{margin-top:16px;font-size:12px;color:#555;text-align:center}
/* card de valor em atraso: texto escuro legível sobre o cinza */
.stat.red{color:#231F20}.stat.red::before{content:none}
</style>
</head>

<script type="module">

/* ===== CONFIGURAÇÃO (preencha conforme o passo a passo) ===== */
const firebaseConfig={apiKey:"COLE_AQUI",authDomain:"COLE_AQUI",projectId:"COLE_AQUI",storageBucket:"COLE_AQUI",messagingSenderId:"COLE_AQUI",appId:"COLE_AQUI"};
/* E-mails com acesso (em minúsculas) e o nome que aparece no histórico */
const EQUIPE={"email.do.daniel@exemplo.com":"Dr. Daniel Pinheiro","email.do.caio@exemplo.com":"Dr. José Caio","email.da.islane@exemplo.com":"Dra. Islane Fernandes","email.da.larissa@exemplo.com":"Dra. Larissa Araújo"};
/* ============================================================ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fd=s=>s?s.split('-').reverse().join('/'):'sem data';
const days=s=>Math.round((pd(s)-today())/864e5);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,10);
const ADV=['Dr. Daniel Pinheiro','Dr. José Caio','Dra. Islane Fernandes','Dra. Larissa Araújo'];
/* nomes usados nas versões anteriores do sistema, corrigidos ao importar um backup */
const NOME_ANTIGO={'Dra. Larrissa Araujo':'Dra. Larissa Araújo','Dra. Daniel Pinheiro':'Dr. Daniel Pinheiro','Dr. Jose Caio':'Dr. José Caio'};
const S={prazos:[],contratos:[],despesas:[],audiencias:[],retiradas:[],clientes:[],propostas:[]};let db=null,tab='painel',ready=false;
let LS=null;try{localStorage.setItem('g','1');LS=localStorage}catch(e){}
const persist=c=>{try{LS&&LS.setItem('gest_'+c,JSON.stringify(S[c]))}catch(e){}};
function save(c,it){if(db){db.collection(c).doc(it.id).set(it).catch(()=>alert('Não foi possível salvar. Verifique se você tem permissão de edição.'))}else{const a=S[c],i=a.findIndex(x=>x.id===it.id);i<0?a.push(it):a[i]=it;persist(c);render()}}
function del(c,id){if(!confirm('Excluir este registro? Esta ação não pode ser desfeita.'))return;if(db){db.collection(c).doc(id).delete().catch(()=>alert('Sem permissão para excluir.'))}else{S[c]=S[c].filter(x=>x.id!==id);persist(c);render()}}
const get=(c,id)=>S[c].find(x=>x.id===id);

/* ---------- cálculos ---------- */
function calc(c){const pa=(c.parcelas||[]).map((p,i)=>({...p,i})).sort((a,b)=>(a.venc||'')<(b.venc||'')?-1:1);let pago=(c.pagos||[]).reduce((s,p)=>s+Number(p.v),0);const recebido=pago;let atraso=0,first=null,nextv=null,semv=false;const ab=[],pl=[];
for(const p of pa){const al=Math.min(p.v,pago);pago-=al;const sd=p.v-al;let ps,pc;
if(sd<=.005){ps='PAGA';pc='grn'}else if(!p.venc){semv=true;ps='DEFINIR VENCIMENTO';pc='mut'}else{ab.push({venc:p.venc,sd});const d=days(p.venc);if(d<0){atraso+=sd;first=first||p.venc;ps='ATRASADA';pc='red'}else{if(!nextv)nextv=p.venc;ps=al>0?'PARCIAL':d<=7?'A VENCER':'EM DIA';pc=al>0?'org':d<=7?'yel':'blu'}}
pl.push({...p,al,sd,ps,pc})}
const valor=Number(c.valor)||0,saldo=valor-recebido;let st,cl;
if(!valor){st='SÓ ÊXITO';cl='mut'}else if(saldo<=.005){st='QUITADO';cl='grn'}else if(atraso>0){st='ATRASADO';cl='red'}else if(!pa.length){st='SEM CRONOGRAMA';cl='mut'}else if(semv&&!nextv){st='INFORMAR VENCIMENTO';cl='yel'}else if(nextv&&days(nextv)<=7){st='A VENCER';cl='yel'}else{st=recebido>0?'PARCIAL':'EM DIA';cl=recebido>0?'org':'blu'}
return{recebido,saldo,atraso,first,nextv,st,cl,ab,pl,dias:first?-days(first):0,semPgto:recebido<=0}}
function pst(p){if(p.cumprido)return{l:'CUMPRIDO',cl:'grn',o:9};if(!p.data)return{l:'INFORMAR DATA FINAL',cl:'mut',o:5};const d=days(p.data);
if(d<0)return{l:'VENCIDO há '+(-d)+' dia(s)',cl:'red',o:0,d};if(d===0)return{l:'VENCE HOJE',cl:'red',o:0,d};if(d<=2)return{l:'CRÍTICO',cl:'org',o:1,d};if(d<=5)return{l:'ATENÇÃO',cl:'yel',o:2,d};return{l:'PROGRAMADO',cl:'blu',o:3,d}}
function dst(x){if(x.pago)return{l:'PAGA',cl:'grn'};if(!x.venc)return{l:'INFORMAR VENCIMENTO',cl:'mut'};const d=days(x.venc);if(d<0)return{l:'VENCIDA há '+(-d)+' dia(s)',cl:'red'};if(d<=7)return{l:'A VENCER',cl:'yel'};return{l:'PENDENTE',cl:'blu'}}
const chip=(t,c)=>`<span class="chip ${c}">${esc(t)}</span>`;

/* ---------- formulários ---------- */
function form(title,fields,vals,onSave){const f=$('#frm');vals=vals||{};
f.innerHTML=`<h2>${esc(title)}</h2>`+fields.map(x=>{const v=vals[x.k]==null?(x.def==null?'':x.def):vals[x.k];
const inp=x.t==='select'?`<select name="${x.k}"><option value=""></option>${x.o.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${x.k}" type="${x.t||'text'}" ${x.t==='number'?'step="0.01" min="0"':''} value="${esc(v)}" ${x.r?'required':''}>`;
return `<label>${esc(x.l)}${x.r?' *':''}</label>${inp}`}).join('')+`<div class="bar" style="margin-top:16px"><button type="button" class="btn" id="cx">Cancelar</button><button class="btn p" value="ok">Salvar</button></div>`;
$('#cx').onclick=()=>$('#dlg').close();
f.onsubmit=e=>{e.preventDefault();const o={};fields.forEach(x=>{let v=f.elements[x.k].value;if(x.t==='number')v=v===''?null:Number(v);o[x.k]=v});$('#dlg').close();onSave(o)};
$('#dlg').showModal()}

/* ---------- ações ---------- */
const A={
novoPrazo:id=>{const p=id?get('prazos',id):{};form(id?'Editar prazo':'Novo prazo',[{k:'cliente',l:'Cliente',r:1},{k:'processo',l:'Número do processo'},{k:'desc',l:'Providência',r:1},{k:'resp',l:'Responsável',t:'select',o:ADV},{k:'data',l:'Data final (conferida pelo advogado)',t:'date'}],p,o=>save('prazos',{...p,...o,id:p.id||uid(),cumprido:p.cumprido||''}))},
cumprir:id=>{const p=get('prazos',id);save('prazos',{...p,cumprido:iso(today())})},
novoContrato:id=>{const c=id?get('contratos',id):{};form(id?'Editar contrato':'Novo contrato',[{k:'cliente',l:'Cliente',r:1},{k:'area',l:'Área'},{k:'processo',l:'Número do processo'},{k:'resp',l:'Responsável',t:'select',o:ADV},{k:'valor',l:'Valor fixo contratado (R$)',t:'number'},{k:'exito',l:'Êxito (ex.: 30% do proveito econômico)'}],c,o=>save('contratos',{parcelas:[],pagos:[],...c,...o,valor:o.valor||0,id:c.id||uid()}))},
parcela:id=>{const c=get('contratos',id);form('Nova parcela de '+c.cliente,[{k:'venc',l:'Vencimento',t:'date',r:1},{k:'v',l:'Valor (R$)',t:'number',r:1}],{},o=>save('contratos',{...c,parcelas:[...(c.parcelas||[]),{venc:o.venc,v:o.v}]}))},

/* ---------- telas ---------- */
function painel(){const t=today(),ym=iso(t).slice(0,7);
const pz=S.prazos.map(p=>({p,s:pst(p)})).filter(x=>!x.p.cumprido);
const ct=S.contratos.map(c=>({c,k:calc(c)}));
const al=[];
pz.filter(x=>x.s.o<=2).sort((a,b)=>a.s.o-b.s.o||(a.p.data<b.p.data?-1:1)).forEach(x=>al.push({o:x.s.o,ch:chip(x.s.l,x.s.cl),tx:`Prazo: ${x.p.desc} — ${x.p.cliente} (${fd(x.p.data)}${x.p.resp?', '+x.p.resp:''})`}));
ct.filter(x=>x.k.st==='ATRASADO').forEach(x=>al.push({o:3,ch:chip('INADIMPLENTE','red'),tx:`${x.c.cliente}: ${brl(x.k.atraso)} em atraso desde ${fd(x.k.first)}`}));
S.despesas.filter(d=>!d.pago&&d.venc&&days(d.venc)<0).forEach(d=>al.push({o:3,ch:chip('DESPESA VENCIDA','red'),tx:`${d.nome} — ${brl(d.valor)} (venc. ${fd(d.venc)})`}));
ct.filter(x=>x.k.st==='A VENCER').forEach(x=>al.push({o:4,ch:chip('A VENCER','yel'),tx:`${x.c.cliente}: parcela em ${fd(x.k.nextv)}`}));
S.despesas.filter(d=>!d.pago&&d.venc&&days(d.venc)>=0&&days(d.venc)<=7).forEach(d=>al.push({o:4,ch:chip('A VENCER','yel'),tx:`${d.nome} — ${brl(d.valor)} (venc. ${fd(d.venc)})`}));
pz.filter(x=>x.s.o===2).forEach(x=>al.push({o:4,ch:chip(x.s.l,'yel'),tx:`Prazo: ${x.p.desc} — ${x.p.cliente} (${fd(x.p.data)})`}));
pz.filter(x=>!x.p.data).forEach(x=>al.push({o:5,ch:chip('PRAZO SEM DATA','mut'),tx:`${x.p.desc} — ${x.p.cliente}: informar a data final`}));
ct.filter(x=>x.k.st==='INFORMAR VENCIMENTO').forEach(x=>al.push({o:5,ch:chip('SEM VENCIMENTO','mut'),tx:`${x.c.cliente}: definir vencimento da parcela`}));
ct.filter(x=>x.k.semPgto&&x.c.valor>0).forEach(x=>al.push({o:6,ch:chip('SEM PAGAMENTO','mut'),tx:`${x.c.cliente}: nenhum recebimento registrado`}));
S.despesas.filter(d=>!d.pago&&!d.venc).forEach(d=>al.push({o:6,ch:chip('DESPESA SEM VENCIMENTO','mut'),tx:`${d.nome} — ${brl(d.valor)}`}));
S.audiencias.filter(a=>a.status!=='Realizada'&&a.data&&days(a.data)>=0&&days(a.data)<=7).forEach(a=>al.push({o:days(a.data)===0?0:2,ch:chip(days(a.data)===0?'AUDIÊNCIA HOJE':'AUDIÊNCIA PRÓXIMA',days(a.data)===0?'red':'org'),tx:`${a.tipo||'Audiência'} — ${a.cliente} (${fd(a.data)}${a.hora?' '+a.hora:''})`}));
S.propostas.filter(x=>x.situacao==='Proposta a enviar').forEach(x=>al.push({o:4,ch:chip('ENVIAR PROPOSTA','org'),tx:`${x.cliente}${x.servico?' — '+x.servico:''}${x.valor?' ('+brl(x.valor)+')':''}`}));
S.propostas.filter(x=>x.situacao==='Proposta enviada'&&x.envio&&-days(x.envio)>=7).forEach(x=>al.push({o:4,ch:chip('SEM RETORNO','yel'),tx:`${x.cliente}: proposta enviada há ${-days(x.envio)} dias — fazer follow-up`}));
S.propostas.filter(x=>x.situacao==='Aguardando assinatura').forEach(x=>al.push({o:3,ch:chip('ASSINATURA','org'),tx:`${x.cliente}: contrato aguardando assinatura`}));
S.clientes.filter(c=>(c.status||'Ativo')==='Ativo'&&(!lastMov(c)||-days(lastMov(c))>30)).forEach(c=>al.push({o:6,ch:chip('SEM MOVIMENTAÇÃO','mut'),tx:`${c.nome}${c.processo?' — '+c.processo:''}: ${lastMov(c)?'última movimentação há '+(-days(lastMov(c)))+' dias':'nenhuma movimentação registrada'}`}));
al.sort((a,b)=>a.o-b.o);
const contr=ct.reduce((s,x)=>s+(Number(x.c.valor)||0),0),rec=ct.reduce((s,x)=>s+x.k.recebido,0),atr=ct.reduce((s,x)=>s+x.k.atraso,0),aRec=ct.reduce((s,x)=>s+Math.max(0,x.k.saldo),0);
const recMes=S.contratos.flatMap(c=>c.pagos||[]).filter(p=>p.d&&p.d.startsWith(ym)).reduce((s,p)=>s+Number(p.v),0);
const dMes=S.despesas.filter(d=>d.venc&&d.venc.startsWith(ym)),dTot=dMes.reduce((s,d)=>s+Number(d.valor),0);
const dPagMes=S.despesas.filter(d=>d.pago&&d.pago.startsWith(ym)).reduce((s,d)=>s+Number(d.valor),0);
const dPend=S.despesas.filter(d=>!d.pago).reduce((s,d)=>s+Number(d.valor),0);
const venc=pz.filter(x=>x.s.o===0).length,crit=pz.filter(x=>x.s.o===1).length,aten=pz.filter(x=>x.s.o===2).length;
return `<div class="card"><h2>Resolver primeiro</h2>${al.length?al.slice(0,14).map(a=>`<div class="alert">${a.ch}<span>${esc(a.tx)}</span></div>`).join(''):'<div class="empty">Nada pendente. Cadastre prazos, contratos e despesas nas abas acima.</div>'}${al.length>14?`<div class="note">+ ${al.length-14} alertas de menor prioridade.</div>`:''}</div>
<h2>Prazos processuais</h2><div class="grid" style="margin-bottom:18px"><div class="stat ${venc?'red':''}"><b>${venc}</b><span>vencidos ou vencendo hoje</span></div><div class="stat"><b>${crit}</b><span>críticos (até 2 dias)</span></div><div class="stat"><b>${aten}</b><span>em atenção (3 a 5 dias)</span></div><div class="stat"><b>${pz.length}</b><span>prazos em aberto</span></div></div>
<h2>Honorários</h2><div class="grid" style="margin-bottom:18px"><div class="stat"><b>${brl(contr)}</b><span>contratado (valores fixos)</span></div><div class="stat"><b>${brl(rec)}</b><span>efetivamente recebido</span></div><div class="stat"><b>${brl(aRec)}</b><span>a receber</span></div><div class="stat ${atr?'red':''}"><b>${brl(atr)}</b><span>em atraso</span></div></div>
<h2>Caixa e despesas do mês</h2><div class="grid"><div class="stat"><b>${brl(recMes)}</b><span>recebido no mês</span></div><div class="stat"><b>${brl(dPagMes)}</b><span>despesas pagas no mês</span></div><div class="stat"><b>${brl(recMes-dPagMes)}</b><span>resultado realizado do mês</span></div><div class="stat"><b>${brl(dTot)}</b><span>despesas com vencimento no mês</span></div><div class="stat"><b>${brl(dPend)}</b><span>despesas pendentes (total)</span></div></div>
<div class="note">Honorários de êxito só entram quando houver êxito e valor. Previsto nunca é contado como recebido.</div>`}

function prazos(){const l=S.prazos.map(p=>({p,s:pst(p)})).sort((a,b)=>a.s.o-b.s.o||((a.p.data||'9')<(b.p.data||'9')?-1:1));
return `<div class="bar"><h2 style="margin:0">Prazos processuais</h2><button class="btn p" data-a="novoPrazo">Novo prazo</button></div><div class="note">A data final deve ser calculada e conferida pelo advogado responsável (legislação, feriados e suspensões). O app só acompanha a data informada.</div>
<div class="card tw">${l.length?`<table><thead><tr><th>Situação</th><th>Data final</th><th>Cliente / processo</th><th>Providência</th><th>Responsável</th><th></th></tr></thead><tbody>${l.map(({p,s})=>`<tr><td>${chip(s.l,s.cl)}</td><td>${p.data?fd(p.data):'—'}</td><td>${esc(p.cliente)}<div class="sub">${esc(p.processo)}</div></td><td>${esc(p.desc)}</td><td>${esc(p.resp)}</td><td><div class="row-actions">${p.cumprido?'':`<button class="btn" data-a="cumprir" data-id="${p.id}">Cumprido</button>`}<button class="btn" data-a="novoPrazo" data-id="${p.id}">Editar</button><button class="btn d" data-a="excl" data-c="prazos" data-id="${p.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhum prazo cadastrado.</div>'}</div>`}

function honor(){const l=S.contratos;
return `<div class="bar"><h2 style="margin:0">Honorários e contratos</h2><button class="btn p" data-a="novoContrato">Novo contrato</button></div>${faixas()}
${l.length?l.map(c=>{const k=calc(c);return `<div class="ct"><div class="bar" style="margin:0"><h3>${esc(c.cliente)}</h3>${chip(k.st,k.cl)}</div><div class="meta">${esc([c.area,c.processo,c.resp].filter(Boolean).join(' · ')||'Processo e responsável pendentes')}${c.exito?' · Êxito: '+esc(c.exito):''}</div>
<div class="kv"><div><small>Valor fixo</small><b>${brl(c.valor)}</b></div><div><small>Recebido</small><b>${brl(k.recebido)}</b></div><div><small>Saldo</small><b>${brl(Math.max(0,k.saldo))}</b></div><div><small>Em atraso</small><b>${brl(k.atraso)}</b></div></div>
<div class="lst"><b>PARCELAS</b></div>${k.pl.length?`<div class="tw"><table class="pt"><thead><tr><th>Parcela</th><th>Vencimento</th><th class="num">Valor</th><th class="num">Pago</th><th class="num">Saldo</th><th>Situação</th></tr></thead><tbody>${k.pl.map((p,n)=>`<tr><td><b>${n+1}ª</b></td><td>${p.venc?'<b>'+fd(p.venc)+'</b>':`<a href="#" data-a="venc" data-id="${c.id}" data-i="${p.i}">definir vencimento</a>`}</td><td class="num"><b>${brl(p.v)}</b></td><td class="num">${brl(p.al)}</td><td class="num">${brl(p.sd)}</td><td>${chip(p.ps,p.pc)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="lst">Nenhuma parcela cadastrada.</div>'}
<div class="lst"><b>Pagamentos recebidos:</b> ${(c.pagos||[]).length?c.pagos.map(p=>brl(p.v)+' em '+fd(p.d)).join(' · '):'nenhum registrado'}</div>
${k.atraso>0?`<div class="lst"><b>Próxima providência de cobrança:</b> ${sug(k.dias)} (${k.dias} dia(s) de atraso)</div>`:''}<div class="row-actions" style="margin-top:10px"><button class="btn" data-a="pagto" data-id="${c.id}">Registrar pagamento</button><button class="btn" data-a="parcela" data-id="${c.id}">Adicionar parcela</button><button class="btn" data-a="novoContrato" data-id="${c.id}">Editar</button><button class="btn d" data-a="excl" data-c="contratos" data-id="${c.id}">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhum contrato cadastrado.</div>'}
<div class="note">Os pagamentos são abatidos da parcela mais antiga para a mais nova.</div>`}

function desp(){const l=[...S.despesas].sort((a,b)=>(a.venc||'9')<(b.venc||'9')?-1:1),tot=l.reduce((s,d)=>s+Number(d.valor),0),pend=l.filter(d=>!d.pago).reduce((s,d)=>s+Number(d.valor),0);
return `<div class="bar"><h2 style="margin:0">Despesas</h2><button class="btn p" data-a="novaDesp">Nova despesa</button></div><div class="note">Total lançado: ${brl(tot)} · Pendente: ${brl(pend)}. Registre o pagamento só quando for confirmado.</div>

function sug(d){return d<=5?'mensagem de cobrança amigável (lembrete)':d<=15?'contato telefônico e reenvio dos dados de pagamento':d<=30?'contato do(a) sócio(a) e proposta de revisão das condições de pagamento':'cobrança formal e avaliação das medidas previstas no contrato e no Código de Ética da OAB'}
function faixas(){const f=[['Até 5 dias',0,5],['6 a 15 dias',6,15],['16 a 30 dias',16,30],['Acima de 30 dias',31,1e9]],ks=S.contratos.map(calc).filter(k=>k.atraso>0);return `<div class="grid" style="margin-bottom:14px">${f.map(([l,a,b])=>{const m=ks.filter(k=>k.dias>=a&&k.dias<=b);return `<div class="stat ${m.length?'red':''}"><b>${brl(m.reduce((s,k)=>s+k.atraso,0))}</b><span>Atraso ${l}: ${m.length} contrato(s)</span></div>`}).join('')}</div>`}
function audiencias(){const l=[...S.audiencias].sort((a,b)=>(a.data||'9')<(b.data||'9')?-1:1);
return `<div class="bar"><h2 style="margin:0">Audiências e compromissos</h2><button class="btn p" data-a="novaAud">Nova audiência</button></div><div class="card tw">${l.length?`<table><thead><tr><th>Situação</th><th>Data</th><th>Cliente / processo</th><th>Tipo / local</th><th>Responsável</th><th></th></tr></thead><tbody>${l.map(a=>{const d=a.data?days(a.data):null;const s=a.status==='Realizada'?chip('REALIZADA','grn'):d==null?chip('INFORMAR DATA','mut'):d<0?chip('DATA PASSADA - ATUALIZAR','yel'):d===0?chip('HOJE','red'):d<=7?chip('PRÓXIMA','org'):chip('AGENDADA','blu');return `<tr><td>${s}</td><td>${fd(a.data)}${a.hora?'<div class="sub">'+esc(a.hora)+'</div>':''}</td><td>${esc(a.cliente)}<div class="sub">${esc(a.processo)}</div></td><td>${esc([a.tipo,a.local].filter(Boolean).join(' · '))}</td><td>${esc(a.resp)}</td><td><div class="row-actions">${a.status==='Realizada'?'':`<button class="btn" data-a="audOk" data-id="${a.id}">Realizada</button>`}<button class="btn" data-a="novaAud" data-id="${a.id}">Editar</button><button class="btn d" data-a="excl" data-c="audiencias" data-id="${a.id}">Excluir</button></div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhuma audiência cadastrada.</div>'}</div>`}
function fluxo(){const t=today(),ms=[];for(let i=0;i<12;i++)ms.push(iso(new Date(t.getFullYear(),t.getMonth()+i,1)).slice(0,7));
const ks=S.contratos.map(calc),pagos=S.contratos.flatMap(c=>c.pagos||[]),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),inM=(s,m)=>!!s&&s.startsWith(m);
let acc=0,proj=0;const R={ent:[],fx:[],vr:[],imp:[],inv:[],ret:[],res:[],sal:[],rec:[],pag:[],pro:[]};
ms.forEach((m,i)=>{const dp=S.despesas.filter(d=>d.pago&&inM(d.pago,m)),rt=S.retiradas.filter(r=>inM(r.data,m)),v=x=>+x.valor;
const ent=sum(pagos.filter(p=>inM(p.d,m)),p=>+p.v),imp=sum(dp.filter(d=>d.cat==='Impostos e taxas'),v),fx=sum(dp.filter(d=>d.cat!=='Impostos e taxas'&&d.tipo==='Fixa'),v),vr=sum(dp.filter(d=>d.cat!=='Impostos e taxas'&&d.tipo!=='Fixa'),v),inv=sum(rt.filter(r=>r.tipo==='Investimento'),v),ret=sum(rt.filter(r=>r.tipo!=='Investimento'),v);
const res=ent-imp-fx-vr-inv-ret;acc+=res;const test=i===0?(x=>!!x&&x<ms[1]+'-01'):(x=>inM(x,m));
const rec=sum(ks.flatMap(k=>k.ab).filter(a=>test(a.venc)),a=>a.sd),pag=sum(S.despesas.filter(d=>!d.pago&&test(d.venc)),v);proj+=res+rec-pag;
R.ent.push(ent);R.fx.push(fx);R.vr.push(vr);R.imp.push(imp);R.inv.push(inv);R.ret.push(ret);R.res.push(res);R.sal.push(acc);R.rec.push(rec);R.pag.push(pag);R.pro.push(proj)});
const rows=[['Honorários recebidos',R.ent],['Despesas fixas',R.fx],['Despesas variáveis',R.vr],['Impostos e taxas',R.imp],['Investimentos',R.inv],['Retiradas dos sócios',R.ret],['Resultado realizado',R.res,1],['Saldo realizado acumulado',R.sal,1],['Honorários a receber (previsto)',R.rec],['Despesas a pagar (previsto)',R.pag],['Saldo projetado (realizado + previsto)',R.pro,1]];
const rl=[...S.retiradas].sort((a,b)=>a.data<b.data?-1:1);
return `<div class="bar"><h2 style="margin:0">Fluxo de caixa (12 meses)</h2><button class="btn p" data-a="novaRet">Retirada / investimento</button></div><div class="note">Entradas e saídas realizadas só contam o que foi registrado como recebido ou pago. O previsto é separado; no primeiro mês inclui vencidos em aberto. Saldo inicial considerado: R$ 0,00. Entradas aqui são só honorários de contratos.</div><div class="card tw"><table><thead><tr><th></th>${ms.map(m=>`<th class="num">${m.slice(5)}/${m.slice(0,4)}</th>`).join('')}</tr></thead><tbody>${rows.map(([l,a,b])=>`<tr><td>${b?'<b>'+l+'</b>':l}</td>${a.map(x=>`<td class="num">${b?'<b>'+brl(x)+'</b>':(x?brl(x):'-')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><h2>Retiradas e investimentos</h2><div class="card tw">${rl.length?`<table><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th><th class="num">Valor</th><th></th></tr></thead><tbody>${rl.map(r=>`<tr><td>${fd(r.data)}</td><td>${esc(r.tipo)}</td><td>${esc(r.desc)}</td><td class="num">${brl(r.valor)}</td><td><button class="btn d" data-a="excl" data-c="retiradas" data-id="${r.id}">Excluir</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhuma retirada ou investimento registrado.</div>'}</div>`}
const lastMovPlaceholder=0;
const lastMov=c=>(c.movs||[]).reduce((m,x)=>x.d>m?x.d:m,'');
function clientes(){const l=[...S.clientes].sort((a,b)=>a.nome.localeCompare(b.nome));
return `<div class="bar"><h2 style="margin:0">Clientes e processos</h2><button class="btn p" data-a="novoCli">Novo cliente / processo</button></div><div class="note">Registre cada andamento em “Movimentação”. Processo ativo sem movimentação há mais de 30 dias gera alerta no Painel.</div>
${l.length?l.map(c=>{const lm=lastMov(c),dd=lm?-days(lm):0,ct=S.contratos.find(x=>x.cliente===c.nome),k=ct?calc(ct):null,mv=[...(c.movs||[])].sort((a,b)=>a.d<b.d?1:-1);
return `<div class="ct"><div class="bar" style="margin:0"><h3>${esc(c.nome)}</h3><span>${chip(c.status||'Ativo',(c.status||'Ativo')==='Ativo'?'grn':'mut')} ${k?chip('Financeiro: '+k.st,k.cl):''}</span></div>
<div class="meta">${esc([c.area,c.processo||'processo sem número',c.vara,c.resp].filter(Boolean).join(' · '))}${c.parte?' · Parte contrária: '+esc(c.parte):''}</div>
<div class="kv"><div><small>Última movimentação</small><b>${lm?fd(lm)+' ('+dd+' dia(s))':'nenhuma registrada'}</b></div></div>
${mv.slice(0,5).map(m=>`<div class="lst"><b>${fd(m.d)}</b> — ${esc(m.t)}${m.r?' ('+esc(m.r)+')':''}</div>`).join('')}${c.obs?`<div class="lst">Obs.: ${esc(c.obs)}</div>`:''}
<div class="row-actions" style="margin-top:10px"><button class="btn p" data-a="novaMov" data-id="${c.id}">+ Movimentação</button><button class="btn" data-a="novoCli" data-id="${c.id}">Editar</button><button class="btn d" data-a="excl" data-c="clientes" data-id="${c.id}">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhum cliente cadastrado.</div>'}`}
const PS={'Proposta a enviar':'org','Proposta enviada':'yel','Aguardando assinatura':'org','Contrato fechado':'grn','Desistiu':'mut'};
function propostas(){const l=[...S.propostas].sort((a,b)=>(a.envio||'9')<(b.envio||'9')?-1:1),open=l.filter(x=>x.situacao!=='Contrato fechado'&&x.situacao!=='Desistiu'),env=l.filter(x=>x.envio).length,fech=l.filter(x=>x.situacao==='Contrato fechado').length;
return `<div class="bar"><h2 style="margin:0">Novos clientes e propostas</h2><button class="btn p" data-a="novaProp">Novo cliente / proposta</button></div>
<div class="grid" style="margin-bottom:14px"><div class="stat"><b>${open.length}</b><span>negociações em aberto</span></div><div class="stat"><b>${brl(open.reduce((s,x)=>s+(+x.valor||0),0))}</b><span>valor em propostas abertas</span></div><div class="stat"><b>${fech}</b><span>contratos fechados</span></div><div class="stat"><b>${env?Math.round(fech/env*100):0}%</b><span>conversão (fechados ÷ propostas enviadas)</span></div></div>
<div class="card tw">${l.length?`<table><thead><tr><th>Situação</th><th>Cliente / contato</th><th>Serviço</th><th class="num">Proposta</th><th>Envio</th><th></th></tr></thead><tbody>${l.map(x=>{const o=x.situacao!=='Contrato fechado'&&x.situacao!=='Desistiu';return `<tr><td>${chip(x.situacao||'Proposta a enviar',PS[x.situacao]||'org')}</td><td>${esc(x.cliente)}<div class="sub">${esc(x.contato)}</div></td><td>${esc(x.servico)}${x.obs?'<div class="sub">'+esc(x.obs)+'</div>':''}</td><td class="num">${x.valor?brl(x.valor):'—'}</td><td>${x.envio?fd(x.envio)+(o?'<div class="sub">há '+(-days(x.envio))+' dia(s)</div>':''):'—'}</td><td><div class="row-actions">${o?`<button class="btn" data-a="propFech" data-id="${x.id}">Fechou contrato</button><button class="btn" data-a="propDes" data-id="${x.id}">Desistiu</button>`:''}<button class="btn" data-a="novaProp" data-id="${x.id}">Editar</button><button class="btn d" data-a="excl" data-c="propostas" data-id="${x.id}">Excluir</button></div></td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Nenhuma negociação cadastrada.</div>'}</div><div class="note">Ao fechar, cadastre o contrato na aba Honorários.</div>`}
const TABS={painel:['Painel',painel],cli:['Clientes e processos',clientes],prop:['Novos clientes',propostas],prazos:['Prazos',prazos],aud:['Audiências',audiencias],honor:['Honorários',honor],desp:['Despesas',desp],fluxo:['Fluxo de caixa',fluxo],ativ:['Atividade',atividade]};
function render(){if(!ready)return;$('#hdr').textContent='Hoje: '+fd(iso(today()));
$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button role="tab" data-tab="${k}" aria-selected="${k===tab}">${v[0]}</button>`).join('');
$('#main').innerHTML=TABS[tab][1]()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-a]');if(!t)return;e.preventDefault();
if(t.dataset.tab){tab=t.dataset.tab;try{history.replaceState(null,'','#'+tab)}catch(x){}render();return}
const a=t.dataset.a;if(a==='excl')A.excl(t.dataset.c,t.dataset.id);else if(a==='venc')A.venc(t.dataset.id,+t.dataset.i);else A[a](t.dataset.id)});

/* Nenhum dado de cliente fica no código do site. Os dados ficam só no banco protegido (Firestore).
   Para trazer os dados da versão anterior, use "Importar backup". */
const SEED={};
/* ---------- Firebase: login, tempo real e histórico ---------- */
const NOMES={prazos:'prazo',contratos:'contrato',despesas:'despesa',audiencias:'audiência',retiradas:'retirada/investimento',clientes:'cliente/processo',propostas:'proposta'};
let ME=null,LOG=[],fs=null,auth=null,unsubs=[];
function atividade(){return `<h2>Atividade recente</h2><div class="note">Quem alterou o quê (últimas 60 ações).</div><div class="card tw">${LOG.length?`<table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Registro</th></tr></thead><tbody>${LOG.map(l=>`<tr><td>${l.em&&l.em.toDate?l.em.toDate().toLocaleString('pt-BR'):'agora'}</td><td>${esc(l.quem)}</td><td>${esc(l.acao)} ${esc(NOMES[l.col]||l.col)}</td><td>${esc(l.t)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nenhuma atividade registrada ainda.</div>'}</div>`}
const who=o=>o.cliente||o.nome||o.desc||'';
async function FBsave(c,it){const {_em,_by,...d}=it;await setDoc(doc(fs,c,it.id),{...d,_by:ME.nome,_em:serverTimestamp()});addDoc(collection(fs,'log'),{quem:ME.nome,acao:'salvou',col:c,t:who(it),em:serverTimestamp()}).catch(()=>{})}
async function FBdel(c,id){const old=get(c,id)||{};await deleteDoc(doc(fs,c,id));addDoc(collection(fs,'log'),{quem:ME.nome,acao:'excluiu',col:c,t:who(old),em:serverTimestamp()}).catch(()=>{})}
async function seed(){try{const r=await getDoc(doc(fs,'meta','init'));if(r.exists())return;for(const c of Object.keys(SEED))for(const it of SEED[c])await setDoc(doc(fs,c,it.id),{...it,_by:'Sistema',_em:serverTimestamp()});await setDoc(doc(fs,'meta','init'),{em:serverTimestamp()})}catch(e){}}
function stop(){unsubs.forEach(f=>f());unsubs=[];ready=false;db=null;Object.keys(S).forEach(c=>S[c]=[]);LOG=[]}
function subscribe(){stop();const keys=Object.keys(S),loaded=new Set();
db={collection:c=>({doc:id=>({set:it=>FBsave(c,{...it,id}),delete:()=>FBdel(c,id)})})};
keys.forEach(c=>unsubs.push(onSnapshot(collection(fs,c),s=>{S[c]=s.docs.map(d=>({...d.data(),id:d.id}));loaded.add(c);if(loaded.size>=keys.length&&!ready){ready=true;seed()}if(ready)render()},err=>{$('#mode').textContent='Erro ao ler os dados ('+(err.code||'')+'). Confira as regras do Firestore.'})));
unsubs.push(onSnapshot(query(collection(fs,'log'),orderBy('em','desc'),limit(60)),s=>{LOG=s.docs.map(d=>d.data());if(ready&&tab==='ativ')render()},()=>{}));
$('#mode').textContent='Conectado: as alterações de qualquer sócio aparecem em tempo real para todos.'}
function showLogin(m){$('#login').style.display='flex';$('#lmsg').textContent=m||'';$('#who').textContent='';$('#out').hidden=true;$('#im').hidden=true}
$('#bk').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'pinheiro',v:1,dados:S},null,1)],{type:'application/json'}));a.download='pinheiro-backup-'+iso(today())+'.json';document.body.appendChild(a);a.click();a.remove()};
if(firebaseConfig.apiKey.startsWith('COLE')){showLogin('Área interna em configuração: falta ligar o banco de dados (Firebase). Veja o guia AREA-INTERNA.md.');$('#lf button').disabled=true}
else{const app=initializeApp(firebaseConfig);auth=getAuth(app);fs=getFirestore(app);
$('#lf').onsubmit=async e=>{e.preventDefault();$('#lmsg').textContent='Entrando…';try{await signInWithEmailAndPassword(auth,$('#le').value.trim(),$('#lp').value)}catch(x){$('#lmsg').textContent='E-mail ou senha incorretos.'}};
$('#lr').onclick=async()=>{const m=$('#le').value.trim();if(!m){$('#lmsg').textContent='Digite seu e-mail acima.';return}try{await sendPasswordResetEmail(auth,m);$('#lmsg').textContent='Se o e-mail estiver cadastrado, você receberá o link para redefinir a senha.'}catch(x){$('#lmsg').textContent='Não foi possível enviar o e-mail.'}};
$('#out').onclick=()=>signOut(auth);
$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();
r.onload=async()=>{let j;try{j=JSON.parse(r.result);if(!j||!j.dados)throw 0}catch(x){alert('Arquivo de backup inválido.');return}
const cols=Object.keys(S).filter(c=>Array.isArray(j.dados[c]));const n=cols.reduce((s,c)=>s+j.dados[c].length,0);
if(!n){alert('O backup não tem registros.');return}
if(!confirm('Importar '+n+' registro(s) deste backup? Registros com o mesmo código serão atualizados; os demais dados continuam como estão.'))return;
const fix=v=>NOME_ANTIGO[v]||v;
$('#mode').textContent='Importando backup…';let ok=0,erro=0;
for(const c of cols)for(const it of j.dados[c]){if(!it||!it.id)continue;const {_em,_by,...d}=it;if(d.resp)d.resp=fix(d.resp);if(Array.isArray(d.movs))d.movs=d.movs.map(m=>m&&m.r?{...m,r:fix(m.r)}:m);
try{await setDoc(doc(fs,c,String(it.id)),{...d,id:String(it.id),_by:ME.nome,_em:serverTimestamp()});ok++}catch(x){erro++}}
addDoc(collection(fs,'log'),{quem:ME.nome,acao:'importou backup',col:'',t:ok+' registro(s)',em:serverTimestamp()}).catch(()=>{});
$('#mode').textContent='Conectado: as alterações de qualquer sócio aparecem em tempo real para todos.';
alert(erro?('Importados: '+ok+'. Falharam: '+erro+'. Verifique sua conexão e tente de novo.'):('Backup importado: '+ok+' registro(s).'))};r.readAsText(f)};
onAuthStateChanged(auth,u=>{if(!u){stop();showLogin();return}const em=(u.email||'').toLowerCase();if(!EQUIPE[em]){signOut(auth);showLogin('Este e-mail não tem acesso ao sistema.');return}
ME={email:em,nome:EQUIPE[em]};$('#login').style.display='none';$('#who').textContent=ME.nome;$('#out').hidden=false;$('#im').hidden=false;const h=location.hash.slice(1);if(TABS[h])tab=h;subscribe()})}
</script>
</body>
</html>
